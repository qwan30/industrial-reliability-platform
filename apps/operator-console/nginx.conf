server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://scoring-api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /healthz {
        proxy_pass http://scoring-api:8000/healthz;
        proxy_http_version 1.1;
    }

    location /readyz {
        proxy_pass http://scoring-api:8000/readyz;
        proxy_http_version 1.1;
    }

}
