services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp_password
      POSTGRES_DB: irp
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./db/migrations:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp -d irp"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  scoring-api:
    build: .
    command: ["python", "-m", "uvicorn", "industrial_reliability.api:create_app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./artifacts/champion:/runtime/champion:ro"]
    environment:
      CHAMPION_PACKAGE_DIR: /runtime/champion
      CHAMPION_MANIFEST_SHA256: ${CHAMPION_MANIFEST_SHA256:-}
      DATABASE_URL: postgresql://irp:irp_password@postgres:5432/irp
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  replay-producer:
    build: .
    command: ["python", "-m", "industrial_reliability.replay_service"]
    volumes:
      - "./data/processed/phase1b:/runtime/data:ro"
      - "./artifacts/champion:/runtime/champion:ro"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLIENT_ID: industrial-reliability
      REPLAY_PARQUET_PATH: /runtime/data/metropt3/telemetry.parquet
    depends_on:
      kafka:
        condition: service_healthy

  streaming-worker:
    build: .
    command: ["python", "-m", "industrial_reliability.worker"]
    volumes:
      - "./artifacts/champion:/runtime/champion:ro"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCORING_API_URL: http://scoring-api:8000
      CHAMPION_PACKAGE_DIR: /runtime/champion
      CHAMPION_MANIFEST_SHA256: ${CHAMPION_MANIFEST_SHA256:-}
      DATABASE_URL: postgresql://irp:irp_password@postgres:5432/irp
    depends_on:
      kafka:
        condition: service_healthy
      scoring-api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  operator-console:
    build:
      context: ./apps/operator-console
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      scoring-api:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
