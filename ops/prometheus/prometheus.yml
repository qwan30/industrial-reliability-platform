global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "scoring-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["scoring-api:8000"]

  - job_name: "replay-producer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["replay-producer:9101"]

  - job_name: "streaming-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["streaming-worker:9102"]

  - job_name: "alert-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["alert-service:9103"]

