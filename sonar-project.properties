sonar.projectKey=qwan30_industrial-reliability-platform
sonar.organization=qwan30
sonar.sources=src,apps/operator-console/src
sonar.tests=tests,apps/operator-console/src/__tests__,apps/operator-console/src/components/__tests__
sonar.exclusions=**/*.json,**/*.md,**/*.parquet,**/*.csv,apps/operator-console/dist/**,apps/operator-console/node_modules/**,apps/operator-console/e2e/**
sonar.cpd.exclusions=tests/**,apps/operator-console/src/__tests__/**,apps/operator-console/src/components/__tests__/**
sonar.python.version=3.12
sonar.javascript.environments=browser
sonar.issue.ignore.multicriteria=e1,e2
# Ignore S5778 (multiple statements in pytest.raises) in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*
# Ignore S8572 in worker
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.e2.resourceKey=src/industrial_reliability/worker.py
